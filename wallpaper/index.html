<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Desktop Hub</title>
  <!-- Wallpaper Engine loads this file from disk. It frames the hub served by server.py, so widgets are
       edited in desktop_hub/web/ and never need copying here. While the backend is down it shows a note
       and keeps checking. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
    #wait { position: fixed; inset: 0; display: grid; place-items: center; color: #5b6074;
      font: 15px "Segoe UI", system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="wait">Waiting for Desktop Hub on 127.0.0.1:8765…</div>
  <iframe id="hub" title="Desktop Hub"></iframe>
  <script>
    const HUB = "http://127.0.0.1:8765/";
    const frame = document.getElementById("hub"), wait = document.getElementById("wait");
    let up = false;
    async function check() {
      let ok = false;
      try { ok = (await fetch(HUB + "api/health", { cache: "no-store" })).ok; } catch (e) {}
      if (ok && !up) { frame.src = HUB + "?t=" + Date.now(); frame.style.display = "block"; wait.style.display = "none"; }
      if (!ok && up) { frame.style.display = "none"; wait.style.display = "grid"; }
      up = ok;
      setTimeout(check, up ? 15000 : 3000);
    }
    check();
  </script>
</body>
</html>
